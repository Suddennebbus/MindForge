server {
    listen 80;
    server_name _;

    root /app/static;
    index index.html;

    # PDF/Office uploads
    client_max_body_size 100m;

    # 关键：server 级别的 types 块会覆盖 http 级别 mime.types 的映射，
    # 所以必须先 include 回完整映射，否则 index.html 会以
    # application/octet-stream 返回（浏览器弹下载框而非渲染页面）。
    include /etc/nginx/mime.types;

    # pdfjs-dist v6 的 worker 是 ES module (.mjs)。module worker 要求
    # application/javascript MIME type，而 nginx 默认 mime.types 未映射
    # .mjs（会回落到 application/octet-stream），导致 worker 加载失败、
    # PDF 阅读空白。此处追加 .mjs 映射（与上面 include 的映射合并）。
    types {
        application/javascript mjs;
    }

    # Backend API (strip the /api prefix, same as the vite dev proxy)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # LLM-backed endpoints (ingest / explore / plans / chat) can run long
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
